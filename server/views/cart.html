<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cargo Bot · ระบบรถขนส่งอเนกประสงค์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f3f5f7; --surface:#fff; --line:#d9dee5; --fg:#16202c; --muted:#5b6876; --chip:#eef1f5;
    --accent:#0f6e8c; --accent-fg:#fff; --ok:#1f9d55; --ok-bg:#e7f6ee; --err:#d64545; --warn:#b7791f; --warn-bg:#fdf3e1;
    --hero1:#0b4a63; --hero2:#0f6e8c; --hero3:#1f9b84;
    --tint:#eef5f7; --box1:#d6ebf1; --box2:#ffffff;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#0f151c; --surface:#18212b; --line:#2a3644; --fg:#e4eaf1; --muted:#93a1b2; --chip:#223040;
    --accent:#3ab0d4; --accent-fg:#06222c; --ok:#3fbf73; --ok-bg:#16301f; --err:#ff7a7a; --warn:#f2b13f; --warn-bg:#33270f; --tint:#14202a; --box1:#1c3a47; --box2:#18212b; } }
  :root[data-theme="dark"] {
    --bg:#0f151c; --surface:#18212b; --line:#2a3644; --fg:#e4eaf1; --muted:#93a1b2; --chip:#223040;
    --accent:#3ab0d4; --accent-fg:#06222c; --ok:#3fbf73; --ok-bg:#16301f; --err:#ff7a7a; --warn:#f2b13f; --warn-bg:#33270f; --tint:#14202a; --box1:#1c3a47; --box2:#18212b; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg); font:16px/1.5 "IBM Plex Sans Thai", system-ui, sans-serif;
    display:flex; align-items:flex-start; justify-content:center; padding:24px 16px; }
  .card { width:100%; max-width:440px; background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden;
    box-shadow:0 6px 24px rgba(16,32,44,.08); }
  .head { color:#fff; padding:18px 20px; display:flex; align-items:center; gap:12px; }
  .head svg { flex:none; }
  .logo { display:grid; place-items:center; flex:none; }
  .head h1 { margin:0; font-size:1.2rem; }
  .head p { margin:0; font-size:.85rem; opacity:.85; }
  .body { padding:20px; display:flex; flex-direction:column; gap:14px; }
  h2 { margin:0; font-size:1.1rem; }
  .muted { color:var(--muted); font-size:.9rem; margin:0; }
  label { font-size:.85rem; color:var(--muted); display:block; margin-bottom:6px; }
  input { width:100%; font:inherit; font-size:1.15rem; letter-spacing:.02em; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg); color:var(--fg); }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button { font:inherit; font-weight:600; border-radius:10px; padding:13px 14px; cursor:pointer; border:1px solid var(--line); background:var(--chip); color:var(--fg); }
  button.primary { background:var(--accent); color:var(--accent-fg); border-color:transparent; }
  button.return { background:var(--warn); color:#fff; border-color:transparent; }
  button:disabled { opacity:.6; cursor:wait; }
  .row { display:flex; gap:10px; } .row > * { flex:1; }
  .person { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:12px; background:var(--chip); }
  .avatar { width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:1.2rem; color:#fff; background:var(--accent); flex:none; }
  .person b { display:block; font-size:1.1rem; }
  .carts { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:8px; }
  .cart { text-align:left; padding:12px; }
  .cart small { display:block; font-weight:400; color:var(--muted); }
  .cart[aria-pressed="true"] { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset; }
  .loan { padding:12px 14px; border-radius:12px; background:var(--warn-bg); border-left:4px solid var(--warn); }
  .check { display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:12px; border:1px solid var(--line); cursor:pointer; }
  .check input { width:22px; height:22px; margin:2px 0 0; flex:none; }
  .err { color:var(--err); min-height:1.4em; margin:0; font-size:.92rem; }
  .done { text-align:center; padding:8px 0; }
  .done .big { width:84px; height:84px; margin:4px auto 10px; border-radius:50%; display:grid; place-items:center; background:var(--ok-bg); color:var(--ok); }
  .done.ret .big { background:var(--warn-bg); color:var(--warn); }
  .done h2 { font-size:1.35rem; }
  .ticket { margin-top:12px; text-align:left; border:1px dashed var(--line); border-radius:12px; padding:12px 14px; display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:.95rem; }
  .ticket dt { color:var(--muted); } .ticket dd { margin:0; font-weight:600; }
  .top { background:radial-gradient(120% 140% at 100% 0%, var(--hero3) 0%, transparent 55%), linear-gradient(120deg, var(--hero1), var(--hero2)); }
  .art { padding:0 20px; color:#fff; }
  .art svg { display:block; width:100%; max-width:360px; height:auto; margin:0 auto; }
  @media (prefers-reduced-motion: no-preference) {
    .art .truck { animation:drive 3.2s ease-in-out infinite; }
    .art .wheel { animation:bump .6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
    @keyframes drive { 0%,100% { transform:translateX(0); } 50% { transform:translateX(6px); } }
    @keyframes bump { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-1px); } }
  }
  .admin-btn { display:flex; align-items:center; justify-content:center; gap:8px; padding:11px 14px; border-radius:10px; border:1px solid var(--line);
    color:var(--muted); text-decoration:none; font-weight:600; font-size:.92rem; }
  .admin-btn:hover { color:var(--fg); background:var(--chip); }
  .seg { display:flex; gap:4px; padding:4px; border-radius:12px; background:var(--chip); }
  .seg button { flex:1; border:0; background:none; color:var(--muted); padding:10px; border-radius:9px; }
  .seg button[aria-pressed="true"] { background:var(--surface); color:var(--fg); box-shadow:0 1px 3px rgba(16,32,44,.12); }
  button.admin-btn { width:100%; background:none; font:inherit; font-weight:600; font-size:.92rem; }
</style>
</head>
<body>
<main class="card">
  <div class="top">
  <div class="head">
    <span class="logo" aria-hidden="true"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 4h2"/><path d="M19 4v12H3"/><rect x="5" y="8" width="7" height="8" rx="1"/><circle cx="6" cy="19.5" r="1.6"/><circle cx="16" cy="19.5" r="1.6"/></svg></span>
    <div><h1>Cargo Bot</h1><p>ระบบรถขนส่งอเนกประสงค์</p></div>
  </div>

  <!-- ภาพรถเข็น (หน้าแรก) -->
  <div class="art" id="art" aria-hidden="true">
    <svg viewBox="0 0 360 210">
        <path d="M44 52 C 120 6, 236 6, 316 46" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2.5" stroke-dasharray="1 9" stroke-linecap="round"/>
        <g><path d="M44 58c-10-13-15-20-15-27a15 15 0 0 1 30 0c0 7-5 14-15 27z" fill="#ffd27a"/><circle cx="44" cy="31" r="5.5" fill="var(--hero1)"/></g>
        <g><path d="M316 52c-10-13-15-20-15-27a15 15 0 0 1 30 0c0 7-5 14-15 27z" fill="#fff"/><circle cx="316" cy="25" r="5.5" fill="var(--hero2)"/></g>
        <rect x="0" y="184" width="360" height="5" rx="2.5" fill="#fff" fill-opacity=".35"/>
        <path d="M14 199 H346" stroke="#fff" stroke-opacity=".28" stroke-width="3" stroke-dasharray="18 14"/>
        <g class="truck">
          <path d="M258 158V82a14 14 0 0 1 14-14h20" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="284" y="62" width="22" height="12" rx="6" fill="#ffd27a"/>
          <g stroke="var(--hero2)" stroke-width="3" stroke-linejoin="round">
            <rect x="74" y="98" width="82" height="60" rx="5" fill="#ffd27a"/>
            <path d="M115 98v18M74 112h82" fill="none" stroke-opacity=".55"/>
            <rect x="162" y="110" width="78" height="48" rx="5" fill="#fff"/>
            <path d="M201 110v16" fill="none"/>
            <rect x="92" y="52" width="58" height="46" rx="5" fill="#fff"/>
            <path d="M121 52v14" fill="none"/>
          </g>
          <rect x="60" y="158" width="206" height="12" rx="5" fill="#fff"/>
          <rect x="86" y="170" width="6" height="8" fill="#fff"/>
          <rect x="236" y="170" width="6" height="8" fill="#fff"/>
          <g class="wheel"><circle cx="89" cy="181" r="12" fill="#0c3340"/><circle cx="89" cy="181" r="4.5" fill="#fff"/></g>
          <g class="wheel"><circle cx="239" cy="181" r="12" fill="#0c3340"/><circle cx="239" cy="181" r="4.5" fill="#fff"/></g>
        </g>
      </svg>
  </div>
  </div>

  <!-- 1. ใส่เบอร์โทร -->
  <form class="body" id="sPhone">
    <div class="seg" role="group" aria-label="เข้าสู่ระบบในฐานะ">
      <button type="button" data-m="staff" aria-pressed="true">พนักงาน</button>
      <button type="button" data-m="admin" aria-pressed="false">ผู้ดูแลระบบ</button>
    </div>
    <div>
      <label for="phone">เข้าสู่ระบบด้วย เบอร์โทร / อีเมล</label>
      <input id="phone" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="เช่น 0812345678 หรือ อีเมล" required>
    </div>
    <div id="adminPassBox" hidden>
      <label for="adminPass">รหัสผ่าน</label>
      <input id="adminPass" type="password" autocomplete="current-password">
    </div>
    <button class="primary" id="goPhone" type="submit">ถัดไป</button>
    <p class="err" id="ePhone" role="alert"></p>
    <a class="admin-btn" id="resume" href="app" hidden></a>
  </form>

  <!-- 2. แสดงชื่อ + เลือกรถ / เห็นรถที่ยืมอยู่ -->
  <section class="body" id="sWho" hidden>
    <div class="person"><span class="avatar" id="avatar">-</span><div><span class="muted">สวัสดี</span><b id="whoName">-</b></div></div>
    <div id="borrowBox">
      <h2 style="margin-bottom:8px">เลือกรถเข็นที่ต้องการใช้</h2>
      <div class="carts" id="cartList"></div>
      <p class="muted" id="noCart" hidden>ตอนนี้ไม่มีรถเข็นว่าง</p>
    </div>
    <div id="returnBox" hidden>
      <div class="loan"><b id="loanCart">-</b><br><span class="muted" id="loanSince">-</span></div>
    </div>
    <div class="row">
      <button type="button" id="notMe">ไม่ใช่ฉัน</button>
      <button type="button" class="primary" id="goNext" disabled>ขอใช้รถเข็น</button>
    </div>
    <button type="button" class="admin-btn" id="goLogin">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
      <span id="goLoginText">เข้าสู่ระบบ (ไม่ใช้รถเข็น)</span></button>
    <p class="err" id="eWho" role="alert"></p>
  </section>

  <!-- 3. ยืนยันตัวตน -->
  <form class="body" id="sVerify" hidden>
    <h2 id="vTitle">ยืนยันตัวตน</h2>
    <p class="muted" id="vWhat">-</p>
    <div id="pinBox">
      <label for="pin">PIN / รหัสผ่านของคุณ</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password">
    </div>
    <label class="check" id="confirmBox"><input type="checkbox" id="confirmMe"><span>ฉันคือ <b id="confirmName">-</b> เจ้าของเบอร์นี้<span id="confirmCart"> และขอรับผิดชอบรถเข็นคันนี้</span></span></label>
    <div class="row">
      <button type="button" id="back">ย้อนกลับ</button>
      <button type="submit" class="primary" id="goVerify">ยืนยัน</button>
    </div>
    <p class="err" id="eVerify" role="alert"></p>
  </form>

  <!-- 4. หน้าจอยืนยันการใช้ / การคืน -->
  <section class="body" id="sDone" hidden>
    <div class="done" id="doneBox">
      <div class="big"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2 id="doneTitle">-</h2>
      <p class="muted" id="doneSub">-</p>
      <dl class="ticket" id="ticket"></dl>
    </div>
    <button class="primary" type="button" id="enterApp" hidden>เข้าสู่ระบบบันทึกการขนส่ง</button>
    <button type="button" id="finish">เสร็จสิ้น</button>
    <p class="muted" style="text-align:center" id="countdown"></p>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const preset = (new URLSearchParams(location.search).get('cart') || '').toUpperCase();   // QR ติดรถ: /cart?cart=CART-01
let info = null, mode = 'borrow', chosen = '', timer = null;

async function rpc(action, params) {
  const r = await fetch('rpc', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, params }) })
    .then(x => x.json()).catch(() => ({ ok: false, message: 'เชื่อมต่อระบบไม่ได้ กรุณาลองใหม่' }));
  if (!r.ok) throw new Error(r.message || 'เกิดข้อผิดพลาด');
  return r;
}
function show(id) { ['sPhone', 'sWho', 'sVerify', 'sDone'].forEach(s => $(s).hidden = s !== id); $('art').hidden = id !== 'sPhone'; }
function reset() {
  clearInterval(timer); info = null; chosen = ''; $('phone').value = ''; $('adminPass').value = ''; setMode('staff'); $('pin').value = ''; $('ePhone').textContent = '';
  show('sPhone'); $('phone').focus();
}

/* เบอร์โทร 10 หลัก (ขีด/เว้นวรรค/+66 ได้) หรือ อีเมล → ปุ่มกดได้เมื่อรูปแบบถูก */
let loginMode = 'staff';   // staff = พนักงาน (ยืม-คืนรถ/เข้าสู่ระบบ) / admin = ผู้ดูแลระบบ (รหัสผ่าน)
const isEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
const phone10 = v => { v = v.replace(/[\s\-().]/g, ''); if (/^\+?66\d{9}$/.test(v)) v = '0' + v.replace(/^\+?66/, ''); return /^0\d{9}$/.test(v) ? v : ''; };
function phoneInput() {
  // พิมพ์เป็นตัวเลข = เบอร์โทร: รับเฉพาะตัวเลข สูงสุด 10 ตัว (พิมพ์ตัวอักษร/@ = อีเมล ไม่จำกัด)
  const raw = $('phone').value;
  if (/^[\d\s\-()+]*$/.test(raw)) {
    const d = raw.replace(/\D/g, '').slice(0, 10);
    if (raw !== d) $('phone').value = d;
  }
  const v = $('phone').value.trim();
  $('goPhone').disabled = !(isEmail(v) || phone10(v)) || (loginMode === 'admin' && !$('adminPass').value);
}
$('phone').addEventListener('input', phoneInput);
$('adminPass').addEventListener('input', phoneInput);
function setMode(m) {
  loginMode = m;
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === m));
  $('adminPassBox').hidden = m !== 'admin'; $('adminPass').required = m === 'admin';
  $('goPhone').textContent = m === 'admin' ? 'เข้าสู่ระบบ' : 'ถัดไป';
  $('ePhone').textContent = ''; phoneInput();
}
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { setMode(b.dataset.m); $(b.dataset.m === 'admin' && $('phone').value ? 'adminPass' : 'phone').focus(); });

/* 1 → 2: ค้นหาชื่อจากเบอร์ */
$('sPhone').addEventListener('submit', async e => {
  e.preventDefault(); $('goPhone').disabled = true; $('ePhone').textContent = '';
  if (loginMode === 'admin') {   // ผู้ดูแลระบบ: เบอร์โทร/อีเมล + รหัสผ่าน → เข้าระบบเลย
    try {
      const r = await rpc('emailLogin', { email: $('phone').value.trim(), password: $('adminPass').value, adminOnly: true });
      store.set('cargo.session', r.session); store.set('cargo.loginId', $('phone').value.trim());
      return enterApp();
    } catch (err) { $('ePhone').textContent = err.message; $('adminPass').value = ''; }
    finally { phoneInput(); }
    return;
  }
  try { info = await rpc('cartLookup', { phone: $('phone').value.trim() }); renderWho(); }
  catch (err) { $('ePhone').textContent = err.message; }
  finally { phoneInput(); }
});

function renderWho() {
  $('eWho').textContent = ''; $('goLoginText').textContent = 'เข้าสู่ระบบ (ไม่ใช้รถเข็น)';
  $('whoName').textContent = info.name; $('avatar').textContent = info.name.trim().charAt(0) || '?';
  mode = info.loan ? 'return' : 'borrow';
  $('borrowBox').hidden = mode !== 'borrow'; $('returnBox').hidden = mode !== 'return';
  if (mode === 'return') {
    $('loanCart').textContent = 'คุณยืม ' + info.loan.cartName + ' (' + info.loan.cartId + ') อยู่';
    $('loanSince').textContent = 'ตั้งแต่ ' + info.loan.borrowedAt + ' · ' + info.loan.minutes + ' นาที · บันทึกขนส่งแล้ว ' + (info.loan.moves || 0) + ' รายการ';
    $('goNext').textContent = 'คืนรถเข็น'; $('goNext').className = 'return';
    // คืนได้เมื่อบันทึกขนส่งระหว่างยืมแล้วอย่างน้อย 1 รายการ
    $('goNext').disabled = !(info.loan.moves > 0);
    $('eWho').textContent = info.loan.moves > 0 ? '' : 'ยังคืนรถเข็นไม่ได้: กรุณาเข้าสู่ระบบแล้วบันทึกขนส่งก่อน';
    $('goLoginText').textContent = info.loan.moves > 0 ? 'เข้าสู่ระบบ (ไม่ใช้รถเข็น)' : 'เข้าสู่ระบบเพื่อบันทึกขนส่ง';
  } else {
    $('goNext').textContent = 'ขอใช้รถเข็น'; $('goNext').className = 'primary';
    const list = $('cartList'); list.textContent = '';
    chosen = info.carts.some(c => c.id === preset) ? preset : (info.carts.length === 1 ? info.carts[0].id : '');
    info.carts.forEach(c => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'cart'; b.dataset.id = c.id;
      b.append(c.name); const s = document.createElement('small'); s.textContent = c.id; b.append(s);
      b.onclick = () => { chosen = c.id; markCart(); };
      list.appendChild(b);
    });
    $('noCart').hidden = info.carts.length > 0;
    markCart();
  }
  show('sWho');
}
function markCart() {
  document.querySelectorAll('.cart').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === chosen));
  if (mode === 'borrow') $('goNext').disabled = !chosen;
}
$('notMe').onclick = reset;

/* 2 → 3: ยืนยันตัวตนด้วยการติ๊ก "ฉันคือ …" (ไม่ต้องใส่ PIN) */
let action = 'borrow';   // borrow / return / login
function openVerify(act) {
  action = act;
  const cart = act === 'borrow' ? info.carts.find(c => c.id === chosen) : act === 'return' ? { id: info.loan.cartId, name: info.loan.cartName } : null;
  $('vTitle').textContent = { borrow: 'ยืนยันตัวตนผู้ขอใช้', return: 'ยืนยันตัวตนผู้คืน', login: 'ยืนยันตัวตนเพื่อเข้าสู่ระบบ' }[act];
  $('vWhat').textContent = cart ? (act === 'borrow' ? 'ขอใช้ ' : 'คืน ') + cart.name + ' (' + cart.id + ') ในชื่อ ' + info.name
    : 'เข้าสู่ระบบ Cargo Bot ในชื่อ ' + info.name + (info.admin ? ' (ผู้ดูแลระบบ)' : '');
  $('confirmCart').hidden = act === 'login';
  $('pinBox').hidden = !info.hasPin; $('confirmBox').hidden = info.hasPin;
  $('confirmName').textContent = info.name; $('confirmMe').checked = false; $('pin').value = ''; $('eVerify').textContent = '';
  $('goVerify').textContent = { borrow: 'ยืนยันการใช้', return: 'ยืนยันการคืน', login: 'เข้าสู่ระบบ' }[act];
  show('sVerify');
  (info.hasPin ? $('pin') : $('confirmMe')).focus();
}
$('goNext').onclick = () => openVerify(mode);
$('goLogin').onclick = () => {
  if (info.admin) { show('sPhone'); setMode('admin'); $('adminPass').focus(); return; }   // ผู้ดูแลเข้าด้วยรหัสผ่าน
  openVerify('login');
};
$('back').onclick = () => show('sWho');

/* 3 → 4: บันทึก แล้วแสดงหน้าจอยืนยัน */
$('sVerify').addEventListener('submit', async e => {
  e.preventDefault();
  if (!info.hasPin && !$('confirmMe').checked) { $('eVerify').textContent = 'กรุณาติ๊กยืนยันว่าคุณคือ ' + info.name; return; }
  $('goVerify').disabled = true; $('eVerify').textContent = '';
  const params = { phone: $('phone').value.trim(), pin: $('pin').value, confirm: !info.hasPin && $('confirmMe').checked };
  try {
    if (action === 'login') {   // เข้าสู่ระบบอย่างเดียว ไม่ยืม/คืนรถ
      const r = await rpc('phoneLogin', params);
      store.set('cargo.session', r.session); store.set('cargo.loginId', $('phone').value.trim());
      return enterApp();
    }
    const r = action === 'borrow' ? await rpc('cartBorrow', Object.assign(params, { cartId: chosen })) : await rpc('cartReturn', params);
    renderDone(r.loan, r.session);
  } catch (err) { $('eVerify').textContent = err.message; }
  finally { $('goVerify').disabled = false; }
});

const store = { set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };
let pendingSession = null;
function enterApp() { clearInterval(timer); location.href = 'app'; }
$('enterApp').onclick = enterApp;
function renderDone(l, session) {
  // ยืนยันตัวตนแล้ว → เข้าสู่ระบบแอปหลัก (/app) ให้เลย ใช้ session เดียวกับหน้าเข้าสู่ระบบ
  pendingSession = session || null;
  if (session) { store.set('cargo.session', session); store.set('cargo.loginId', $('phone').value.trim()); }
  $('enterApp').hidden = !session;
  $('finish').className = session ? '' : 'primary';
  $('finish').textContent = session ? 'ไม่เข้าระบบ (ออกจากระบบ)' : 'เสร็จสิ้น';
  const ret = action === 'return';
  $('doneBox').className = 'done' + (ret ? ' ret' : '');
  $('doneTitle').textContent = ret ? 'ยืนยันการคืนรถเข็นแล้ว' : 'ยืนยันการใช้รถเข็นแล้ว';
  $('doneSub').textContent = ret ? 'ขอบคุณที่นำรถเข็นมาคืน' : 'กรุณานำมาคืนเมื่อใช้งานเสร็จ';
  const rows = [['รถเข็น', l.cartName + ' (' + l.cartId + ')'], [ret ? 'ผู้คืน' : 'ผู้ใช้', l.name], ['เบอร์โทร', l.phone || '-'],
    ['เวลายืม', l.borrowedAt]].concat(ret ? [['เวลาคืน', l.returnedAt], ['ระยะเวลา', l.minutes + ' นาที']] : [])
    .concat([['ยืนยันตัวตน', l.verifiedBy === 'pin' ? 'PIN' : 'ยืนยันชื่อ'], ['เลขที่รายการ', l.id]]);
  const t = $('ticket'); t.textContent = '';
  rows.forEach(([k, v]) => { const dt = document.createElement('dt'), dd = document.createElement('dd'); dt.textContent = k; dd.textContent = v; t.append(dt, dd); });
  show('sDone');
  let n = session ? 5 : 20;
  const say = () => $('countdown').textContent = (session ? 'เข้าสู่ระบบใน ' : 'กลับหน้าแรกใน ') + n + ' วินาที';
  say();
  timer = setInterval(() => { n--; say(); if (n <= 0) session ? enterApp() : reset(); }, 1000);
}
/* ไม่เข้าระบบ (เช่น แท็บเล็ตกลางที่จุดวางรถ): ยกเลิก session ที่เพิ่งได้ แล้วกลับหน้าแรก */
phoneInput();
$('finish').onclick = () => {
  if (pendingSession) {
    fetch('rpc', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'logout', params: {}, session: pendingSession }) }).catch(() => {});
    store.set('cargo.session', null); pendingSession = null;
  }
  reset();
};
/* เข้าสู่ระบบค้างอยู่แล้ว → แสดงปุ่มกลับเข้าระบบ */
(async () => {
  let s = null; try { s = localStorage.getItem('cargo.session'); } catch (e) {}
  if (!s) return;
  const r = await fetch('rpc', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'me', params: {}, session: s }) }).then(x => x.json()).catch(() => null);
  if (r && r.ok) { $('resume').textContent = 'กลับเข้าระบบในชื่อ ' + r.user.name + ' →'; $('resume').hidden = false; }
})();
$('phone').focus();
</script>
